name: Backend CI/CD - Clasificador de Gastos

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- 1️⃣ Clonar el repo ---
      - name: Checkout repo
        uses: actions/checkout@v3

     # --- 2️⃣ Instalar Python 3.12 ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- 3️⃣ Instalar dependencias ---
      - name: Install dependencies
        working-directory: .
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # --- 5️⃣ Empaquetar el proyecto ---
      - name: Package app
        working-directory: .
        run: |
          tar --exclude='venv' --exclude='.git' -czf app.tar.gz .

      # --- 6️⃣ Subir a EC2 ---
      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "clasificador_gastos/app.tar.gz"
          target: "/home/ubuntu/app/"

      # --- 7️⃣ Reiniciar el servicio en EC2 ---
      - name: Restart app on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/app
            tar -xzf app.tar.gz
            rm app.tar.gz
            sudo systemctl stop clasificador-gastos || true
            sudo systemctl daemon-reload
            sudo systemctl start clasificador-gastos
            sudo systemctl status clasificador-gastos --no-pager -l
